name: Generate Contribution Snake

on:
  # 每天 UTC 00:00（北京时间 08:00）自动更新一次
  schedule:
    - cron: "0 0 * * *"
  # 支持在 Actions 页面手动触发
  workflow_dispatch:
  # 推送到 main 分支时自动运行一次
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d96b38&color_dots=#eaeaf3,#c4cff4,#a2b3eb,#7c8fd0,#5469ad
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffab6e&color_dots=#24273c,#3f4667,#606da4,#889ce4,#b5c7ff

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
